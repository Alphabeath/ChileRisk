services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      # PyJWT requires ≥32 bytes HMAC; Dokploy/prod MUST set AUTH_SECRET in env.
      AUTH_SECRET: ${AUTH_SECRET:-dev-change-me-generate-a-long-secret}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Use 127.0.0.1 — Alpine/busybox wget resolves localhost→::1 but Next listens IPv4 only.
      # Required for healthy status in Docker/Dokploy (Traefik/health probes).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    build: ./backend
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://chilerisk:chilerisk@db:5432/chilerisk
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
      AUTH_SECRET: ${AUTH_SECRET:-dev-change-me-generate-a-long-secret}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-noreply@chilerisk.local}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 avoids IPv6 localhost mismatch on some hosts (Dokploy/VPS).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 6
      # Cold start runs CSN/meteo/SERNAPRED/AireChile syncs before Uvicorn listens (~1–2 min on VPS).
      start_period: 180s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chilerisk
      POSTGRES_USER: chilerisk
      POSTGRES_PASSWORD: chilerisk
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # PostgreSQL host port (configured in the root .env file)
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chilerisk -d chilerisk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # Adminer — solo desarrollo local (profile tools)
  # ============================================
  # Local: `make up` / `docker compose --profile tools up`
  # Dokploy/VPS: no activar profile tools (no exponer Adminer en prod).
  # Acceso local: http://localhost:8080
  #   System: PostgreSQL · Server: db · User/Pass/DB: chilerisk
  adminer:
    image: adminer
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
