services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-dev-change-me-in-production}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    build: ./backend
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://chilerisk:chilerisk@db:5432/chilerisk
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
      AUTH_SECRET: ${AUTH_SECRET:-dev-change-me-in-production}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-noreply@chilerisk.local}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Python-based healthcheck (no extra packages needed in slim image)
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 25s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chilerisk
      POSTGRES_USER: chilerisk
      POSTGRES_PASSWORD: chilerisk
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # PostgreSQL host port (configured in the root .env file)
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chilerisk -d chilerisk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # Adminer - Interfaz visual para la base de datos (desarrollo)
  # ============================================
  # Se levanta automáticamente con `docker compose up`
  # Acceso: http://localhost:8080
  #
  # Conexión:
  #   System: PostgreSQL
  #   Server: db
  #   Usuario: chilerisk
  #   Password: chilerisk
  #   Base de datos: chilerisk
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
